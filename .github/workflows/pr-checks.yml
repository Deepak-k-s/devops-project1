name: Pull request checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  checks:
    name: Lint, test, build, and scan
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install CI tools
        run: python -m pip install --disable-pip-version-check pytest flake8 bandit

      - name: Lint Python code
        run: flake8 --max-line-length=120 app test

      - name: Run SAST
        run: bandit -r app -s B104

      - name: Run unit tests
        run: pytest -q test

      - name: Build container image
        run: docker build --tag devops-project1:pr .

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devops-project1:pr
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
